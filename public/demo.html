<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اقصادي — فيديو العرض</title>
  <meta name="description" content="فيديو عرض اقصادي: كل أقساطك بمكان واحد، وتعرف قبل لا تقسّط إذا تقدر.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #0b1220; --card: #111a2e; --text: #f4f1e8; --text-2: #b8b3a5; --gold: #d4a64a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
    main { width: 100%; max-width: 1100px; padding: 28px 16px 12px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2.2rem); }
    h1 em { font-style: normal; color: var(--gold); }
    p.lead { margin: 0 0 20px; color: var(--text-2); }
    .player { background: var(--card); border: 1px solid rgba(212, 166, 74, 0.35); border-radius: 16px; padding: 10px; }
    video { display: block; width: 100%; height: auto; border-radius: 10px; background: #000; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .actions a { color: var(--bg); background: var(--gold); text-decoration: none; padding: 10px 18px; border-radius: 999px; font-weight: 700; }
    .actions a.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
    footer { margin: auto 0 0; padding: 24px 16px; color: var(--text-2); font-size: 0.85rem; text-align: center; }
    footer b { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>كل أقساطك <em>بمكان واحد</em></h1>
    <p class="lead">فيديو عرض اقصادي — المشروع النهائي، CODED · Web with AI</p>
    <div class="player">
      <video controls playsinline preload="metadata" poster="" src="/media/aqsati-demo.mp4">
        المتصفح ما يدعم تشغيل الفيديو. <a href="/media/aqsati-demo.mp4">حمّل الفيديو</a>
      </video>
    </div>
    <div class="actions">
      <a href="/">افتح اقصادي</a>
      <a class="ghost" href="/media/aqsati-demo.mp4" download>تحميل الفيديو</a>
    </div>
  </main>
  <footer dir="ltr">Powered by <b>Dirbeel Innovation Technology</b></footer>
</body>
</html>
