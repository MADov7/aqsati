<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'">
  <title>التقويم · أقساطي</title>
  <meta name="description" content="تقويم أقساطك: كل موعد دفع بيومه، المدفوع والباقي، ومجموع الشهر — وتقدر تضيف المواعيد لتقويم جوالك.">
  <meta name="theme-color" content="#0f2a4a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/js/boot.js"></script>
  <link rel="modulepreload" href="/js/core.js">
  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="modulepreload" href="/js/fx.js">
  <link rel="modulepreload" href="/calc.js">
  <link rel="modulepreload" href="/js/pages/calendar.js">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages/calendar.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">تخطّى للمحتوى</a>
  <header id="site-header"></header>

  <main id="main" class="page">
    <div class="container">
      <div class="page-head">
        <div class="page-head-text">
          <p class="page-kicker" data-i18n="cal.kicker">التقويم</p>
          <h1 class="page-title" data-i18n="cal.title">تقويم أقساطك</h1>
          <p class="page-desc" data-i18n="cal.desc">كل موعد دفع بيومه — المدفوع والباقي ومجموع الشهر، وتقدر تضيفها لتقويم جوالك.</p>
        </div>
        <div class="page-actions">
          <button type="button" class="btn btn-gold" id="ics-btn" disabled>
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>
            <span data-i18n="cal.ics">أضف لتقويم جوالك</span>
          </button>
        </div>
      </div>

      <div id="cal-root" aria-busy="true">
        <div class="grid gap-lg">
          <div class="lg-col-8"><div class="skel skel-card cal-skel-main"></div></div>
          <div class="lg-col-4 skel-stack"><div class="skel skel-card"></div><div class="skel skel-card"></div></div>
        </div>
      </div>
    </div>
  </main>

  <nav id="tabbar"></nav>
  <div id="toast" hidden></div>
  <div id="banner" hidden></div>
  <script type="module" src="/js/pages/calendar.js"></script>
</body>
</html>
